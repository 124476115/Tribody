<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="三体：时间之外 - Web RPG" />
    <title>Trisolaris Chronicle</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0a0a1a;
        font-family: Arial, sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #phaser-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      #react-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
      }

      #react-overlay > * {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="phaser-container"></div>
      <div id="react-overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
